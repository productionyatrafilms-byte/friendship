<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title-2"></title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <link rel="stylesheet" href="./assets/css/style.css" />

    <style>
      body {
        background-image: url("./assets/images/bg-image-1.png");
      }

      .title span {
        font-size: 5vw;
      }

      .title {
        border-radius: 1.5vw;
      }

      html[lang="Hindi"] .title,
      html[lang="Gujarati"] .title {
        padding: 1.5vw 2vw 0.5vw 2vw;
      }

      html[lang="Hindi"] .title span,
      html[lang="Gujarati"] .title span {
        font-size: 4vw;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <a class="home-btn" href="index.html">
      <img src="./assets/images/home-btn.png" alt="" />
    </a>

    <div class="title">
      <span data-lang-key="title-2">Title</span>
    </div>

    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujarati">G</div>
    </div>

    <main>
      <div class="pages">
        <a
          class="page page-1"
          data-lang-key="num-1"
          href="what-is-friendship.html"
        ></a>
        <a
          class="page page-2"
          data-lang-key="num-2"
          href="why-do-we-need-friend.html"
        ></a>
        <a
          class="page page-3"
          data-lang-key="num-3"
          href="friendship-grow.html"
        ></a>
      </div>

      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <div class="image-box">
              <video src="./assets/video/3.mp4" autoplay muted loop></video>
            </div>
            <div class="swiper-text" data-lang-key="slide-2.2"></div>
          </div>

          <div class="swiper-slide">
            <div class="image-box">
              <video src="./assets/video/4.mp4" autoplay muted loop></video>
            </div>
            <div class="swiper-text" data-lang-key="slide-2.3"></div>
          </div>

          <div class="swiper-slide">
            <div class="image-box">
              <video src="./assets/video/2.mp4" autoplay muted loop></video>
            </div>
            <div class="swiper-text" data-lang-key="slide-2.1"></div>
          </div>

          <div class="swiper-slide">
            <div class="image-box">
              <video src="./assets/video/5.mp4" autoplay muted loop></video>
            </div>
            <div class="swiper-text" data-lang-key="slide-2.4"></div>
          </div>

          <div class="swiper-slide">
            <div class="image-box">
              <video src="./assets/video/17.mp4" autoplay muted loop></video>
            </div>
            <div class="swiper-text" data-lang-key="slide-2.5"></div>
          </div>
        </div>

        <div class="custom-nav">
          <button class="custom-prev hidden">
            <i class="fa-solid fa-angle-left custom-prev-1"></i>
            <i class="fa-solid fa-angles-left custom-prev-2"></i>
          </button>

          <button class="custom-next">
            <i class="fa-solid fa-angle-right custom-next-1"></i>
            <i class="fa-solid fa-angles-right custom-next-2"></i>
          </button>
        </div>

        <div class="swiper-pagination"></div>
      </div>
    </main>

    <!-- Audios -->
    <audio id="homeAudio" src="./assets/audio/pop.mp3" preload="auto"></audio>
    <audio id="pageAudio" src="./assets/video/audio.mp3" preload="auto"></audio>
    <audio id="navAudio" src="./assets/audio/11.mp3" preload="auto"></audio>

    <audio id="engAudio" src="./assets/audio/Eng.mpeg" preload="auto"></audio>
    <audio id="hinAudio" src="./assets/audio/Hin.mpeg" preload="auto"></audio>
    <audio id="gujAudio" src="./assets/audio/Guj.mpeg" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      const prevBtn = document.querySelector(".custom-prev");
      const nextBtn = document.querySelector(".custom-next");

      const swiper = new Swiper(".mySwiper", {
        loop: false,
        slidesPerView: 1,
        spaceBetween: 0,
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
        speed: 800,
        allowTouchMove: false,

        navigation: {
          nextEl: ".custom-next",
          prevEl: ".custom-prev",
        },

        pagination: {
          el: ".swiper-pagination",
          clickable: true,
          renderBullet: function (index, className) {
            return `<span class="${className}"></span>`;
          },
        },

        on: {
          init: function () {
            updateNavButtons(this);
          },
          slideChange: function () {
            updateNavButtons(this);
          },
        },
      });

      function updateNavButtons(swiperInstance) {
        prevBtn.classList.toggle("hidden", swiperInstance.isBeginning);
        nextBtn.classList.toggle("hidden", swiperInstance.isEnd);
      }
    </script>

    <script src="./assets/js/app.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const homeBtn = document.querySelector(".home-btn");
        const pageBtns = document.querySelectorAll(".pages .page");
        const navBtns = document.querySelectorAll(
          ".custom-prev, .custom-next, .swiper-pagination span"
        );

        const englishBtn = document.querySelector(".english");
        const hindiBtn = document.querySelector(".hindi");
        const gujaratiBtn = document.querySelector(".gujarati");

        const homeAudio = document.getElementById("homeAudio");
        const pageAudio = document.getElementById("pageAudio");
        const navAudio = document.getElementById("navAudio");

        const engAudio = document.getElementById("engAudio");
        const hinAudio = document.getElementById("hinAudio");
        const gujAudio = document.getElementById("gujAudio");

        function stopAllAudio() {
          const audios = [
            homeAudio,
            pageAudio,
            navAudio,
            engAudio,
            hinAudio,
            gujAudio,
          ];

          audios.forEach((audio) => {
            if (audio) {
              audio.pause();
              audio.currentTime = 0;
            }
          });
        }

        function playAudio(audio) {
          if (!audio) return;

          stopAllAudio();
          audio.currentTime = 0;

          const playPromise = audio.play();

          if (playPromise !== undefined) {
            playPromise.catch((error) => {
              console.log("Audio not playing. Check file path or browser:", error);
            });
          }
        }

        homeBtn?.addEventListener("click", function (e) {
          e.preventDefault();

          playAudio(homeAudio);

          setTimeout(() => {
            window.location.href = this.href;
          }, 500);
        });

        pageBtns.forEach((pageBtn) => {
          pageBtn.addEventListener("click", function (e) {
            e.preventDefault();

            playAudio(pageAudio);

            setTimeout(() => {
              window.location.href = this.href;
            }, 600);
          });
        });

        navBtns.forEach((navBtn) => {
          navBtn.addEventListener("click", () => {
            playAudio(navAudio);
          });
        });

        englishBtn?.addEventListener("click", () => {
          playAudio(engAudio);
        });

        hindiBtn?.addEventListener("click", () => {
          playAudio(hinAudio);
        });

        gujaratiBtn?.addEventListener("click", () => {
          playAudio(gujAudio);
        });
      });
    </script>
  </body>
</html>
